services:
  clonavoz-api:
    build: .
    container_name: clonavoz_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./server.py:/app/server.py
      - ./tts_engine.py:/app/tts_engine.py
      - ./text_normalizer.py:/app/text_normalizer.py
      - ./static:/app/static
      - ./models:/app/models
      - ./custom_voices:/app/custom_voices
      - ./outputs:/app/outputs
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
